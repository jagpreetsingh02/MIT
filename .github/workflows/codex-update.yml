name: Reviewed Codex update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-maintenance
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-6-astra
          effort: high
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt-file: .github/codex/prompts/update.md
          output-file: /tmp/codex-summary.md
      # No write token is present in this job. Publication occurs on a fresh runner.
      - run: |
          git add -N .
          git diff --binary > /tmp/proposed.patch
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-patch
          path: /tmp/proposed.patch
  validate:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: proposed-patch
          path: /tmp/proposal
      - run: node scripts/check-agent-patch.mjs /tmp/proposal/proposed.patch
      - run: |
          if [ -s /tmp/proposal/proposed.patch ]; then git apply /tmp/proposal/proposed.patch; fi
          npm ci
          npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: validated-patch
          path: /tmp/proposal/proposed.patch
  publish-pr:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: validated-patch
          path: /tmp/proposal
      - run: node scripts/check-agent-patch.mjs /tmp/proposal/proposed.patch
      - name: Open reviewable pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: codex/maintenance-${{ github.run_id }}
        run: |
          if [ ! -s /tmp/proposal/proposed.patch ]; then exit 0; fi
          git switch -c "$UPDATE_BRANCH"
          git apply /tmp/proposal/proposed.patch
          git config user.name 'RippleGuard maintenance bot'
          git config user.email 'rippleguard-bot@users.noreply.github.com'
          git add src/web src/server/graph.ts tests docs
          git -c core.hooksPath=/dev/null commit -m 'Improve RippleGuard correctness or accessibility'
          git -c core.hooksPath=/dev/null push origin "$UPDATE_BRANCH"
          cat > /tmp/pr-body.md <<'BODY'
          This proposed maintenance change was generated from the committed, scoped prompt and passed the separate validation job.

          Human review is required. Review the diff and CI results before merging; no automatic merge is configured.
          BODY
          gh pr create --base main --head "$UPDATE_BRANCH" --title 'Reviewed RippleGuard maintenance update' --body-file /tmp/pr-body.md --draft
